<title>偷花喵</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
/* 版面：像素畫布滿版；上緣是狀態小晶片，右下是拇指按鈕，對話是底部說話框，選單是置中卡片。
   夜巷單一配色（刻意只做暗色）：靛藍夜色、路燈黃、花瓣粉。 */
:root {
  color-scheme: dark;
  --bg: #12142a;
  --panel: #1d2142;
  --panel-2: #272c55;
  --ink: #fff6e8;
  --ink-dim: #b8b3d8;
  --lamp: #ffd25a;
  --petal: #ff86a8;
  --leaf: #77d48a;
  --edge: #0a0b18;
  --danger: #ff6b6b;
  --paper: #fff6e8;
  --paper-ink: #2a2140;
  --paper-dim: #8a83a8;
  --font-ui: "Huninn", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-px: "Silkscreen", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui);
  overflow: hidden; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
button { font-family: var(--font-ui); -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; background: var(--bg); overflow: hidden; }
#gl, #screen { position: absolute; left: 0; top: 0; display: block; }
#screen { image-rendering: pixelated; }
#screen.ov { image-rendering: auto; }
#touch { position: absolute; inset: 0; touch-action: none; }
#stick { position: absolute; left: -46px; top: -46px; width: 92px; height: 92px; border-radius: 50%; border: 2px solid rgba(255, 246, 232, 0.4); background: rgba(18, 20, 42, 0.28); pointer-events: none; }
#stick.run { border-color: var(--petal); }
#knob { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: rgba(255, 246, 232, 0.85); border: 2px solid var(--edge); }
#stick.run #knob { background: var(--petal); }

#ui {
  position: absolute; inset: 0; box-sizing: border-box; pointer-events: none;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#safe { position: relative; height: 100%; }

/* 狀態列 */
#hud { position: absolute; top: 10px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.hud-l, .hud-r { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 9px;
  background: rgba(18, 20, 42, 0.86); border: 2px solid var(--edge); border-radius: 9px;
  box-shadow: 0 2px 0 var(--edge), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  font-size: 13px; line-height: 1; white-space: nowrap;
}
.chip .lbl { color: var(--ink-dim); font-size: 12px; }
.chip b { font-weight: 400; }
.px { font-family: var(--font-px); font-weight: 400; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }
.chip .px { font-size: 13px; color: var(--ink); }
.chip .of { font-family: var(--font-px); font-size: 10px; color: var(--ink-dim); }
.chip.late .px { color: var(--danger); animation: blink 0.8s steps(2) infinite; }
.chip img { width: 20px; height: 16px; object-fit: contain; align-self: center; }
#hud-cans { align-items: center; }
.icon-btn {
  pointer-events: auto; width: 36px; height: 30px; border-radius: 9px; border: 2px solid var(--edge);
  background: var(--panel-2); color: var(--ink); font-family: var(--font-px); font-size: 12px; box-shadow: 0 2px 0 var(--edge); cursor: pointer;
}
#hud-carry { position: absolute; top: 50px; left: 0; display: flex; gap: 5px; }
.slot { width: 30px; height: 30px; box-sizing: border-box; border: 2px dashed rgba(184, 179, 216, 0.45); border-radius: 8px; background: rgba(18, 20, 42, 0.55); position: relative; display: grid; place-items: center; }
.slot.full { border-style: solid; border-color: var(--edge); background: rgba(39, 44, 85, 0.92); }
.slot img { width: 22px; height: 24px; object-fit: contain; }
.slot i { position: absolute; left: 3px; bottom: 2px; height: 3px; max-width: calc(100% - 6px); background: var(--leaf); border-radius: 2px; }

/* 訂單、店裡的花 */
#hud-orders { position: absolute; top: 50px; right: 0; display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; max-width: 62%; }
.ochip { display: inline-flex; align-items: center; gap: 4px; height: 30px; box-sizing: border-box; padding: 0 8px 0 5px; background: rgba(18, 20, 42, 0.86); border: 2px solid var(--edge); border-radius: 9px; box-shadow: 0 2px 0 var(--edge); font-size: 12px; }
.ochip img { width: 18px; height: 20px; object-fit: contain; }
.ochip .px { font-size: 11px; color: var(--ink); }
.ochip.done { background: rgba(60, 120, 76, 0.92); }
.ochip.done .px { color: #eaffd8; }
.ochip.stock { padding: 0 8px; gap: 5px; }
.ochip .lbl, .ochip.lbl-only { color: var(--ink-dim); font-size: 11.5px; }
.ochip.lbl-only { padding: 0 7px; background: rgba(18, 20, 42, 0.6); }

/* 能力按鈕 */
#skills { position: absolute; right: 90px; bottom: 16px; display: flex; gap: 8px; align-items: flex-end; }
.pad.sk { position: relative; width: 60px; height: 60px; padding: 0 0 6px; border-radius: 18px; background: var(--panel-2); color: var(--ink); font-size: 15px; display: grid; place-items: center; }
.pad.sk i { position: absolute; top: -9px; right: -7px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 4px; border-radius: 10px; background: var(--petal); color: #2a1030; border: 2px solid var(--edge); font-style: normal; font-size: 10px; line-height: 16px; text-align: center; }
.pad.sk kbd { position: absolute; bottom: 4px; left: 0; right: 0; font-family: var(--font-px); font-size: 8px; color: var(--ink-dim); text-align: center; }
.pad.sk.on { background: #e8c08a; color: #3a2410; }
.pad.sk.on kbd { color: #6a4a28; }
.pad.sk.off { background: #4a4e74; color: #9a96b8; }

#toast {
  position: absolute; top: 92px; left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: min(340px, 100%); box-sizing: border-box;
  padding: 8px 12px; background: var(--panel); border: 2px solid var(--edge); border-radius: 10px; box-shadow: 0 3px 0 var(--edge);
  font-size: 14px; line-height: 1.5; text-align: center; color: var(--ink); text-wrap: balance;
}
#toast.show { animation: pop 0.25s ease-out; }
#meter:not([hidden]) ~ #toast { top: 140px; }
#banner { position: absolute; top: 32%; left: 0; right: 0; text-align: center; font-size: 30px; letter-spacing: 3px; color: var(--ink); text-shadow: 0 3px 0 var(--edge), 0 0 20px rgba(255, 210, 90, 0.4); }
#banner.show { animation: banner 2.2s ease forwards; }

/* 說話框 */
#dialog {
  position: absolute; left: 0; right: 96px; bottom: 16px; pointer-events: auto; box-sizing: border-box; min-height: 66px;
  background: var(--paper); color: var(--paper-ink); border: 2px solid var(--edge); border-radius: 12px; box-shadow: 0 4px 0 var(--edge);
  padding: 15px 14px 12px; cursor: pointer;
}
#dialog .d-name { position: absolute; top: -14px; left: 10px; background: var(--petal); color: #2a1030; border: 2px solid var(--edge); border-radius: 8px; padding: 2px 9px; font-size: 13px; }
#dialog .d-text { font-size: 15px; line-height: 1.6; }
#dialog.dim .d-text { color: var(--paper-dim); }
#dialog.intel { box-shadow: 0 4px 0 var(--edge), 0 0 0 3px var(--lamp); }

/* 拇指按鈕 */
#controls { position: absolute; right: 0; bottom: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.pad { pointer-events: auto; border: 2px solid var(--edge); box-shadow: 0 4px 0 var(--edge); cursor: pointer; touch-action: none; }
.pad.act { width: 78px; height: 78px; border-radius: 50%; background: var(--lamp); color: #2a1a08; font-size: 22px; }
.pad.act.long { font-size: 14px; }
.pad.act.off { background: #8f8aa8; color: var(--paper-ink); }
#btn-wait { min-width: 78px; height: 40px; padding: 0 12px; border-radius: 20px; background: var(--panel-2); color: var(--ink); font-size: 14px; }
#btn-wait.on { background: var(--leaf); color: #10301a; }
.pad:active, .btn:active, .buy:active, .cute-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }

/* 王太太的懷疑 */
#meter { position: absolute; top: 50px; left: 0; right: 0; margin: 0 auto; max-width: 300px; box-sizing: border-box; background: rgba(18, 20, 42, 0.92); border: 2px solid var(--edge); border-radius: 10px; padding: 8px 10px; box-shadow: 0 3px 0 var(--edge); }
#meter.alert { border-color: var(--danger); }
.m-label { font-size: 13px; color: var(--ink-dim); }
.m-bar { height: 10px; background: #0d0f22; border: 1px solid #000; border-radius: 5px; overflow: hidden; margin: 6px 0; }
.m-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--lamp), var(--danger)); }
.m-sub { font-size: 13px; }

/* 賣萌選擇 */
#sheet { position: absolute; left: 0; right: 0; bottom: 16px; pointer-events: auto; background: var(--panel); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 0 4px 0 var(--edge); padding: 12px; }
.sheet-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.sheet-head b { font-size: 19px; font-weight: 400; color: var(--petal); }
.sheet-head span { color: var(--ink-dim); font-size: 13px; }
.cute-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.cute-btn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 13px 4px 10px; background: var(--paper); color: var(--paper-ink); border: 2px solid var(--edge); border-radius: 12px; box-shadow: 0 4px 0 var(--edge); font-size: 17px; cursor: pointer; touch-action: none; }
.cute-btn .ch { color: #d93a66; font-size: 14px; letter-spacing: 1px; }
.cute-btn .ch.unk { color: var(--paper-dim); }
.cute-btn kbd { position: absolute; top: 4px; right: 7px; font-family: var(--font-px); font-size: 9px; color: var(--paper-dim); }
.cute-btn .how { font-size: 11.5px; color: var(--paper-dim); }
.sheet-note { margin: 10px 2px 0; font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; }
.oc-note { font-weight: 400; color: #ffcf8a; }
.oc-e { font-style: normal; color: #ffb36b; letter-spacing: 2px; }
.cute-btn.oc-btn .cn { color: #b4560e; }
.cute-btn.dis { opacity: 0.5; box-shadow: 0 2px 0 var(--edge); }
.cute-btn.shake { animation: shake 0.3s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.sheet-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.bq-gift { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 2px; font-size: 13px; color: var(--ink-dim); }
.bq-giftbtn { padding: 6px 10px; border-radius: 10px; border: 2px solid var(--edge); background: #ffe6ee; color: #7a2a44; font: inherit; font-size: 14px; cursor: pointer; box-shadow: 0 3px 0 var(--edge); }
.bq-giftbtn em { font-style: normal; margin-left: 4px; color: #d93a66; font-size: 12px; }
.raid-list { display: flex; flex-direction: column; gap: 7px; max-height: 46vh; overflow-y: auto; }
.cute-btn.raid-btn { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; align-items: center; justify-items: start; gap: 2px 10px; padding: 9px 12px; font-size: 16px; text-align: left; }
.raid-btn .rn small { margin-left: 6px; font-size: 12px; color: #d93a66; letter-spacing: 1px; }
.raid-btn .rf { grid-row: span 2; display: flex; flex-wrap: wrap; gap: 2px; max-width: 140px; justify-content: flex-end; }
.raid-btn .rf img { width: 22px; height: 22px; object-fit: contain; }
.raid-btn .rt { font-size: 12px; color: var(--paper-dim); }
.tally.heat li { grid-template-columns: minmax(0, 1fr) auto auto; }
.tally.heat .nm em { display: block; font-style: normal; font-size: 11.5px; color: var(--ink-dim); }
.tally.heat .stars, .news .stars { color: #ff7a9a; letter-spacing: 1px; font-family: inherit; }
.tally.heat li.up .fr { color: #ff8a70; }
.tally.heat li.down .fr { color: #8fe0a8; }
.newab.master { border-color: #8fe0a8; }
.price.boost b { color: #ff9fbf; }
.sheet-foot .sheet-note { flex: 1; margin: 0; }
.sheet-x { flex: 0 0 auto; min-height: 38px; padding: 6px 16px; font-size: 14px; }
.slot.oc { border-color: #ec9440; background: rgba(120, 64, 20, 0.85); }
.newab.partner .tagnew { background: #ec9440; }

/* 卡片 */
#modal {
  position: absolute; inset: 0; display: grid; place-items: center; box-sizing: border-box; background: rgba(8, 9, 22, 0.6);
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  width: min(380px, 100%); max-height: 100%; box-sizing: border-box; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  background: var(--panel); border: 2px solid var(--edge); border-radius: 16px; box-shadow: 0 6px 0 var(--edge), inset 0 2px 0 rgba(255, 255, 255, 0.06);
  padding: 18px 16px 16px; -webkit-user-select: text; user-select: text;
}
.card.small { width: min(320px, 100%); }
#modal.see { background: radial-gradient(ellipse at 50% 55%, rgba(8, 9, 22, 0.55), rgba(8, 9, 22, 0.1) 70%); align-items: end; }
#modal.see .card { background: rgba(29, 33, 66, 0.9); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); margin-bottom: 4vh; }
.card h1, .card h2 { margin: 0; font-weight: 400; text-wrap: balance; }
.card h2 { font-size: 26px; line-height: 1.25; color: var(--ink); }
.card h3 { margin: 16px 0 6px; font-size: 14px; font-weight: 400; color: var(--lamp); letter-spacing: 2px; }
.eyebrow { margin: 0 0 4px; font-size: 12px; color: var(--petal); letter-spacing: 2px; }
.lead { margin: 10px 0 0; font-size: 14.5px; line-height: 1.65; color: var(--ink); }
.warn { margin: 8px 0 0; font-size: 13px; color: var(--danger); }
.btns { position: sticky; bottom: -16px; display: flex; gap: 8px; flex-wrap: wrap; margin: 12px -16px -16px; padding: 10px 16px 16px; background: linear-gradient(to bottom, rgba(29, 33, 66, 0), var(--panel) 28%); }
.btn { flex: 1 1 auto; min-height: 46px; padding: 10px 14px; font-size: 16px; color: var(--ink); background: var(--panel-2); border: 2px solid var(--edge); border-radius: 12px; box-shadow: 0 4px 0 var(--edge); cursor: pointer; }
.btn.primary { background: var(--lamp); color: #2a1a08; }
.btn:focus-visible, .buy:focus-visible, .cute-btn:focus-visible, .pad:focus-visible, .icon-btn:focus-visible { outline: 3px solid var(--petal); outline-offset: 2px; }

.tally { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.tally li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 7px 8px; background: rgba(10, 11, 24, 0.38); border-radius: 9px; font-size: 14px; }
.tally li.mult { grid-template-columns: 22px minmax(0, 1fr) auto; }
.tally img { width: 22px; height: 24px; object-fit: contain; }
.tally em { font-style: normal; color: var(--ink-dim); }
.tally .fr { color: var(--ink-dim); font-size: 12px; }
.tally .px { color: var(--lamp); font-size: 13px; }
.total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-top: 10px; border-top: 2px dashed rgba(184, 179, 216, 0.28); font-size: 14px; color: var(--ink-dim); }
.total .px { font-size: 26px; color: var(--lamp); }
.cans-earn { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: var(--ink-dim); font-size: 14px; }
.cans-earn img { width: 24px; height: 19px; object-fit: contain; }
.cans-earn .px { margin-left: auto; color: var(--ink); font-size: 15px; }
.rent { margin-top: 14px; }
.rent-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; color: var(--ink-dim); }
.rent-top .px { color: var(--ink); font-size: 11px; }
.rent-bar { height: 12px; background: #0d0f22; border: 2px solid var(--edge); border-radius: 7px; overflow: hidden; margin-top: 6px; }
.rent-bar { display: flex; }
.rent-bar i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--leaf) 0 8px, #5fbf72 8px 16px); }
.rent-bar s { display: block; height: 100%; background: repeating-linear-gradient(90deg, rgba(119, 212, 138, 0.38) 0 8px, rgba(95, 191, 114, 0.28) 8px 16px); text-decoration: none; }
.rent-note { margin: 5px 0 0; font-size: 11.5px; color: var(--ink-dim); }
.mults { margin: 6px 0 0; font-size: 12.5px; color: var(--leaf); line-height: 1.5; }
.mults span { color: var(--ink-dim); margin: 0 2px; }
.total.sub { margin-top: 4px; padding-top: 0; border-top: 0; }
.total.sub .px { font-size: 15px; color: var(--ink); }
.card h3 small { margin-left: 8px; font-size: 11.5px; letter-spacing: 0; color: var(--leaf); }
.tally li.ord.no { opacity: 0.6; }
.tally li.ord.ok .fr { color: var(--leaf); }
.event { margin-top: 12px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--edge); background: var(--panel-2); display: grid; gap: 3px; }
.event b { font-weight: 400; font-size: 17px; color: var(--lamp); }
.event span { font-size: 13.5px; line-height: 1.55; }
.event.ev-rain { background: #233a5c; }
.event.ev-rain b { color: #9fd0ff; }
.event.ev-bbq { background: #4a2e2a; }
.event.ev-bbq b { color: #ffb36b; }
.event.ev-outage { background: #15162a; }
.event.ev-outage b { color: #fff2c0; }
.newab { position: relative; margin-top: 10px; padding: 12px 12px 10px; border-radius: 12px; border: 2px solid var(--petal); background: rgba(255, 134, 168, 0.12); }
.newab b { font-weight: 400; font-size: 18px; color: var(--ink); }
.newab p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.55; }
.tagnew { display: inline-block; margin-right: 8px; padding: 1px 7px; border-radius: 6px; background: var(--petal); color: #2a1030; font-size: 11.5px; vertical-align: 2px; }
.news.react li { display: grid; gap: 2px; background: rgba(255, 107, 107, 0.1); border-color: rgba(255, 107, 107, 0.45); }
.news.react li b { font-weight: 400; }
.news.react li span { font-size: 12.5px; color: var(--ink-dim); }
.news.react li.fresh b::after { content: '新'; margin-left: 6px; padding: 0 5px; border-radius: 5px; background: var(--danger); color: #2a0a0a; font-size: 11px; }

.tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); grid-auto-flow: column; gap: 6px; margin-top: 12px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px; border-radius: 12px; border: 2px solid var(--edge); background: rgba(10, 11, 24, 0.38); color: var(--ink-dim); font-size: 15px; cursor: pointer; }
.tab small { font-size: 11.5px; color: var(--ink-dim); font-family: var(--font-px); }
.tab.on { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 -3px 0 var(--petal); }
.tab.on small { color: var(--lamp); }
.hint { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; }
/* 包花台 */
.bq-made { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(119, 212, 138, 0.16); border: 2px solid rgba(119, 212, 138, 0.5); font-size: 13px; line-height: 1.5; }
.bq-made.new { background: rgba(255, 134, 168, 0.18); border-color: var(--petal); animation: pop 0.3s ease-out; }
.bq-made b { display: block; font-weight: 400; font-size: 15px; color: var(--ink); }
.bq-made span { color: var(--ink-dim); }
.bq-req { margin: 8px 0 0; padding: 7px 10px; border-radius: 10px; background: rgba(255, 210, 90, 0.12); border: 1px dashed rgba(255, 210, 90, 0.6); font-size: 12.5px; line-height: 1.5; color: var(--ink-dim); }
.bq-req b { color: var(--lamp); font-weight: 400; }
.bq-top { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 12px; align-items: center; margin-top: 10px; }
.bq-prev { width: 132px; height: 167px; border-radius: 12px; background: radial-gradient(ellipse at 50% 60%, #3a3f6e, #23274a 70%); border: 2px solid var(--edge); }
.bq-info { min-width: 0; }
